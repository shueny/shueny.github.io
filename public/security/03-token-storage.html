"><circle cx=\"12\" cy=\"12\" r=\"8.5\"></circle><path d=\"M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17\"></path></svg>", "shield": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z\"></path><path d=\"M9 12l2 2 4-4\"></path></svg>", "mail": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\"></rect><path d=\"M4 6.5l8 6 8-6\"></path></svg>", "code": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M8 6l-5 6 5 6M16 6l5 6-5 6\"></path></svg>", "lock": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg>", "window": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\"></rect><path d=\"M3 8h18\"></path><circle cx=\"6\" cy=\"6\" r=\"0.6\" fill=\"currentColor\" stroke=\"none\"></circle><circle cx=\"8.5\" cy=\"6\" r=\"0.6\" fill=\"currentColor\" stroke=\"none\"></circle></svg>"}, SC_L={}, SC_R={};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var MAL='#D7263D';
function isMal(s){return String(s.dotColor||'').toUpperCase()===MAL;}
function demoHtml(d,sm){
  var tabs=d.tabs.map(function(t){return '<div class="dtd-tab'+(t.active?' active':'')+'">'+esc(t.label)+'</div>';}).join('');
  return '<div class="dtd-panel"'+(sm?' style="padding:10px 10px 9px;min-height:76px"':'')+'><div class="dtd-chrome">'+tabs+'</div><div class="dtd-cursor"></div><div class="dtd-click"></div><div class="dtd-line" style="'+(sm?'font-size:10px;':'')+'--dtd-w:'+(d.line.length+3)+'ch">'+esc(d.line)+'</div><div class="dtd-result"'+(sm?' style="font-size:10px"':'')+'>'+esc(d.result)+'</div></div>';
}
function navHtml(){
  var chips=ALL_BOARDS.filter(function(b){return b.file!==OWN_FILE;}).map(function(b){return '<a class="navchip" href="'+b.file+'">'+b.num+' '+esc(b.short)+'</a>';}).join('');
  return '<div class="navlabel">看完了？跳到另一個主題</div><div class="navrow"><a class="navchip home" href="index.html">目錄</a>'+chips+'</div>';
}
function actorCls(a,on,mal){return 'actor '+[a.tone==='bad'?'bad':'',a.tone==='good'?'good':'',on?'on':'',(on&&mal)?'mal':''].filter(Boolean).join(' ');}
function noteOf(s){var nl=s.noteLabel||'駭客觀點';return {label:nl,cls:nl==='正確做法'?'lime':'orange'};}

var step=0, N=LS.length;
var prev=document.getElementById('prev'), next=document.getElementById('next'), cnt=document.getElementById('cnt'), fix=document.getElementById('fix');
function side(p,actors,steps,scenes){
  var el={a:document.getElementById(p+'Actors'),d:document.getElementById(p+'Dot'),p:document.getElementById(p+'Panel')};
  el.a.innerHTML=actors.map(function(a){return '<div class="actor" style="padding:8px 4px">'+ICONS[a.kind]+'<div class="albl" style="font-size:11.5px">'+esc(a.label)+'</div></div>';}).join('');
  return function(){
    var s=steps[step], mal=isMal(s), n=noteOf(s);
    Array.prototype.forEach.call(el.a.children,function(c,idx){c.className=actorCls(actors[idx],(s.active||[]).indexOf(idx)>=0,mal);});
    var vis=s.dotPos!==null&&s.dotPos!==undefined;
    el.d.style.display=vis?'':'none';
    if(vis) el.d.style.left=(Math.round(s.dotPos*400)-11)+'px';
    el.d.className='dot'+(mal?' mal':'');
    el.p.className='panel sm'+(mal?' mal':'');
    var h='<div class="ptitle">'+esc(s.title)+'</div><div class="pdesc">'+esc(s.desc)+'</div><div class="note '+n.cls+'"><span class="tag '+n.cls+'">'+n.label+'</span><span>'+esc(s.note||'')+'</span></div>';
    if(s.code) h+='<div class="code mono">'+esc(s.code)+'</div>';
    if(s.demo) h+=demoHtml(s.demo,true);
    if(scenes[step]) h+=scenes[step];
    el.p.innerHTML=h; el.p.scrollTop=0;
  };
}
var upL=side('left',LA,LS,SC_L), upR=side('right',RA,RS,SC_R);
function update(){
  upL(); upR();
  if(step===N-1){fix.style.display='flex'; fix.innerHTML='<span class="tag lime">根本原因與正確做法</span><div class="pdesc strong">'+esc(FIX.cause)+'</div><div class="code mono">'+esc(FIX.fixCode)+'</div>'+navHtml();}
  else {fix.style.display='none'; fix.innerHTML='';}
  cnt.textContent='步驟 '+(step+1)+' / '+N;
  prev.disabled=step===0; next.disabled=step===N-1;
}
prev.onclick=function(){if(step>0){step--;update();}};
next.onclick=function(){if(step<N-1){step++;update();}};
update();
</script>
