<html lang="zh-Hant">
<head>

<title>Clickjacking 點擊劫持</title>
<style>
body{margin:0;background:#DEDEDB;font-family:'Avenir Next','Helvetica Neue','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}
.f{font-family:'Avenir Next','Helvetica Neue','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}
.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace}
.idx{font-size:16px;font-weight:800;color:#5A645A}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;background:#B9BAB6;color:#3A423A}
.chip.bad{background:#F2BBA3;color:#6E2508}
.chip.good{background:#DDFF00;color:#2E382E}
.actor{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border:2px dashed #8E948E;background:#F4F4F1;color:#2E382E;transition:all .35s ease}
.actor.bad{border-color:#E39A7C;background:#F7ECE5;color:#8F3010}
.actor.good{border-color:#B7D400;background:#F3F9CF;color:#3C4A3C}
.actor.on{border-style:solid;border-color:#DDFF00;background:#3C4A3C;color:#FFFFFF;box-shadow:0 0 16px rgba(221,255,0,.55)}
.actor.on.mal{border-color:#FF6A2B;box-shadow:0 0 16px rgba(255,106,43,.55)}
.albl{font-size:12.5px;font-weight:700;text-align:center;line-height:1.3}
.tline{position:absolute;left:0;right:10px;top:19px;height:0;border-top:2px dashed #7C837C}
.dot{position:absolute;top:8px;min-width:22px;height:22px;box-sizing:border-box;background:#DDFF00;border:2px solid #2E382E;transition:left .6s cubic-bezier(.4,0,.2,1),background .4s ease}
.dot.mal{background:#FF6A2B}
.dotlbl{position:absolute;top:-10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2E382E;white-space:nowrap;transition:left .6s cubic-bezier(.4,0,.2,1)}
.dotlbl.mal{color:#B83A12}
.panel{flex-grow:1;min-height:0;overflow-y:auto;box-sizing:border-box;background:#3C4A3C;border:2px solid #DDFF00;box-shadow:0 0 18px rgba(221,255,0,.4);padding:16px 20px;display:flex;flex-direction:column;gap:9px;color:#FFFFFF;transition:border-color .4s ease}
.panel.mal{border-color:#FF6A2B;box-shadow:0 0 18px rgba(255,106,43,.45)}
.tag{display:inline-block;flex:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;align-self:flex-start}
.tag.lime{background:#DDFF00;color:#2E382E}
.tag.orange{background:#FF6A2B;color:#2A1208}
.ptitle{font-size:20px;font-weight:800;line-height:1.3}
.pdesc{font-size:14px;line-height:1.6;color:#DCE2D6}
.pdesc.strong{color:#FFFFFF;font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6}
.note.orange>span:last-child{color:#FFD3BE}
.note.lime>span:last-child{color:#E8F5A8}
.code{background:#2A332A;border:1px solid #5B695B;color:#EEF1E6;padding:10px 12px;font-size:11.5px;line-height:1.6;white-space:pre-wrap}
.rule{height:2px;background:#5B695B;margin:4px 0 2px}
.navlabel{font-size:11px;font-weight:800;letter-spacing:.08em;color:#B9C3B2;text-transform:uppercase}
.navrow{display:flex;flex-wrap:wrap;gap:6px}
.navchip{display:inline-block;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:6px 9px;border:1.5px solid #AEB8AE;color:#EEF1E8}
.navchip:hover{background:#DDFF00;color:#2E382E;border-color:#DDFF00}
.navchip.home{background:#DDFF00;color:#2E382E;border-color:#DDFF00}
.ctl{display:flex;align-items:center;justify-content:space-between}
.btn{font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;padding:10px 20px;border:2px solid #2E382E;background:transparent;color:#2E382E;cursor:pointer;border-radius:0}
.btn.primary{background:#DDFF00}
.btn:disabled{opacity:.35;cursor:default}
.pg{height:8px;background:#A9ADA6;transition:all .3s ease;box-sizing:border-box}
.pg.on{background:#DDFF00;border:1.5px solid #2E382E}
.cnt{font-size:12px;font-weight:800;letter-spacing:.08em;color:#4A554A}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.panel.sm{padding:12px 14px;gap:7px}
.panel.sm .ptitle{font-size:15px}
.panel.sm .pdesc{font-size:12.5px}
.panel.sm .note{font-size:12px}
.panel.sm .code{font-size:10.5px;padding:8px 10px}
.panel.sm .actor{padding:8px 4px}
.dtd-panel{position:relative;background:#1F271F;border:1px solid #5B695B;padding:14px 14px 12px;overflow:hidden;min-height:88px}
.dtd-chrome{display:flex;gap:6px;margin-bottom:10px;position:relative;z-index:1}
.dtd-tab{font-size:9.5px;font-weight:700;padding:3px 8px;background:#3A463A;color:#C9D1C4}
.dtd-tab.active{background:#DDFF00;color:#2E382E}
.dtd-cursor{position:absolute;left:6%;top:16px;width:0;height:0;border-left:10px solid #FFFFFF;border-bottom:6px solid transparent;border-top:6px solid transparent;transform:rotate(-18deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));animation:dtdMove 1.4s ease-in-out forwards;z-index:3}
@keyframes dtdMove{0%{left:6%;top:16px}65%{left:46%;top:52px}100%{left:46%;top:52px}}
.dtd-click{position:absolute;left:46%;top:52px;width:0;height:0;border-radius:999px;background:rgba(221,255,0,.45);animation:dtdClick .5s ease-out 1.35s forwards;z-index:2}
@keyframes dtdClick{0%{width:0;height:0;opacity:.9;margin-left:0;margin-top:0}100%{width:24px;height:24px;opacity:0;margin-left:-12px;margin-top:-12px}}
.dtd-line{font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:11px;color:#EEF1E6;white-space:nowrap;overflow:hidden;border-right:2px solid #DDFF00;display:inline-block;width:0;animation:dtdType 1s ease-out 1.75s forwards,dtdCaret .6s step-end 1.75s 4;margin-top:30px}
@keyframes dtdType{from{width:0}to{width:var(--dtd-w,30ch)}}
@keyframes dtdCaret{50%{border-color:transparent}}
.dtd-result{font-size:11px;font-weight:700;color:#DDFF00;opacity:0;margin-top:9px;animation:dtdFade .5s ease-out 2.85s forwards}
@keyframes dtdFade{to{opacity:1}}
a.card{text-decoration:none;display:block}
a.card .cardin{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#F4F4F1;border:2px solid #2E382E;color:#2E382E;transition:background .15s ease}
a.card:hover .cardin{background:#DDFF00}

.bw{background:#F4F4F1;border:2px solid #2E382E;color:#2E382E;position:relative;overflow:hidden;font-size:12px}
.bw-top{display:flex;gap:4px;align-items:flex-end;background:#B9BAB6;padding:6px 8px 0}
.bw-tab{font-size:11px;font-weight:700;padding:5px 12px;background:#CFCFCB;color:#4A554A;white-space:nowrap}
.bw-tab.on{background:#F4F4F1;color:#2E382E}
.bw-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid #2E382E;background:#F4F4F1}
.bw-url{flex:1;position:relative;height:22px;line-height:22px;font-size:12px;font-weight:600;padding:0 10px;background:#E4E4E0;font-family:'SFMono-Regular',Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden}
.bw-body{position:relative;padding:14px;min-height:120px}
.lk{display:inline-flex;color:#3C4A3C}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;white-space:nowrap}
.badge.ok{background:#DDFF00;color:#2E382E}
.badge.bad{background:#FF6A2B;color:#2A1208}
.scn-cursor{position:absolute;width:0;height:0;border-left:10px solid #2E382E;border-bottom:6px solid transparent;border-top:6px solid transparent;transform:rotate(-18deg);z-index:5;left:var(--x0);top:var(--y0);animation:scMove 1.2s ease-in-out forwards;filter:drop-shadow(0 1px 1px rgba(255,255,255,.9))}
.scn-ripple{position:absolute;width:0;height:0;border-radius:999px;background:rgba(255,106,43,.55);z-index:4;left:var(--x1);top:var(--y1);opacity:0;animation:scRip .5s ease-out forwards}
@keyframes scMove{from{left:var(--x0);top:var(--y0)}to{left:var(--x1);top:var(--y1)}}
@keyframes scRip{0%{width:0;height:0;opacity:.9;margin:0}100%{width:32px;height:32px;opacity:0;margin:-16px 0 0 -16px}}
.fadein{opacity:0;animation:scFade .5s ease-out forwards}
@keyframes scFade{to{opacity:1}}
@keyframes scOut{to{opacity:0;visibility:hidden}}
@keyframes scTabOff{to{background:#CFCFCB;color:#4A554A}}
@keyframes scTabOn{to{background:#F4F4F1;color:#2E382E}}
.tp{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:0;animation:scType .8s ease-out forwards;font-family:'SFMono-Regular',Menlo,Consolas,monospace}
@keyframes scType{from{width:0}to{width:var(--w)}}
@keyframes scSlide{0%{left:78px;opacity:0}15%{opacity:1}100%{left:58%;opacity:1}}
@keyframes scFlash{to{background:rgba(255,106,43,.45);border-style:solid}}
@keyframes scRowOn{to{opacity:1}}
.fld{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fld .fl{width:44px;font-weight:800;font-size:12px}
.fld .fb{flex:1;max-width:260px;height:30px;box-sizing:border-box;border:2px solid #2E382E;background:#FFFFFF;padding:0 8px;display:flex;align-items:center;font-size:12px}
.wrow{position:relative;height:46px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #CFCFCB;font-weight:700;font-size:13px}

html,body{margin:0;background:#DEDEDB}
#stage{margin:0 auto;overflow:hidden}
#app{transform-origin:0 0}
button{border-radius:0}

</div></div>
<script>
(function(){
  var app=document.getElementById('app'), stage=document.getElementById('stage');
  function fit(){
    var w=document.documentElement.clientWidth, k=Math.min(1,w/960);
    app.style.transform='scale('+k+')';
    stage.style.width=(960*k)+'px';
    stage.style.height=(app.offsetHeight*k)+'px';
  }
  window.addEventListener('resize',fit); fit();
})();
</script>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var MAL='#C2410C';
function isMal(s){return String(s.dotColor||'').toUpperCase()===MAL;}
function demoHtml(d,sm){
  var tabs=d.tabs.map(function(t){return '<div class="dtd-tab'+(t.active?' active':'')+'">'+esc(t.label)+'</div>';}).join('');
  return '<div class="dtd-panel"'+(sm?' style="padding:10px 10px 9px;min-height:76px"':'')+'><div class="dtd-chrome">'+tabs+'</div><div class="dtd-cursor"></div><div class="dtd-click"></div><div class="dtd-line" style="'+(sm?'font-size:10px;':'')+'--dtd-w:'+(d.line.length+3)+'ch">'+esc(d.line)+'</div><div class="dtd-result"'+(sm?' style="font-size:10px"':'')+'>'+esc(d.result)+'</div></div>';
}
function navHtml(){
  var chips=ALL_BOARDS.filter(function(b){return b.file!==OWN_FILE;}).map(function(b){return '<a class="navchip" href="'+b.file+'">'+b.num+' '+esc(b.short)+'</a>';}).join('');
  return '<div class="navlabel">看完了？跳到另一個主題</div><div class="navrow"><a class="navchip home" href="index.html">目錄</a>'+chips+'</div>';
}
function actorCls(a,on,mal){return 'actor '+[a.tone==='bad'?'bad':'',a.tone==='good'?'good':'',on?'on':'',(on&&mal)?'mal':''].filter(Boolean).join(' ');}
function noteOf(s){var nl=s.noteLabel||'駭客觀點';return {label:nl,cls:nl==='正確做法'?'lime':'orange'};}

var step=0, N=STEPS.length;
var actorsEl=document.getElementById('actors'), dot=document.getElementById('dot'), dotlbl=document.getElementById('dotlbl'),
    panel=document.getElementById('panel'), prev=document.getElementById('prev'), next=document.getElementById('next'), pgs=document.getElementById('pgs');
actorsEl.innerHTML=ACTORS.map(function(a){return '<div class="actor">'+ICONS[a.kind]+'<div class="albl">'+esc(a.label)+'</div></div>';}).join('');
function panelHtml(s){
  var n=noteOf(s);
  var h='<span class="tag lime">步驟 '+(step+1)+' / '+N+'</span><div class="ptitle">'+esc(s.title)+'</div><div class="pdesc">'+esc(s.desc)+'</div><div class="note '+n.cls+'"><span class="tag '+n.cls+'">'+n.label+'</span><span>'+esc(s.note||'')+'</span></div>';
  if(s.code) h+='<div class="code mono">'+esc(s.code)+'</div>';
  if(s.demo) h+=demoHtml(s.demo,false);
  if(SCENES[step]) h+=SCENES[step];
  if(step===N-1) h+='<div class="rule"></div><span class="tag lime">根本原因與正確做法</span><div class="pdesc strong">'+esc(FIX.cause)+'</div><div class="code mono">'+esc(FIX.fixCode)+'</div>'+navHtml();
  return h;
}
function update(){
  var s=STEPS[step], mal=isMal(s), stageW=872;
  Array.prototype.forEach.call(actorsEl.children,function(el,idx){el.className=actorCls(ACTORS[idx],(s.active||[]).indexOf(idx)>=0,mal);});
  var vis=s.dotPos!==null&&s.dotPos!==undefined;
  dot.style.display=dotlbl.style.display=vis?'':'none';
  if(vis){var x=Math.round(s.dotPos*stageW)-11; dot.style.left=x+'px'; dotlbl.style.left=Math.max(0,x-24)+'px'; dotlbl.textContent=s.dotLabel||'';}
  dot.className='dot'+(mal?' mal':''); dotlbl.className='dotlbl'+(mal?' mal':'');
  panel.className='panel'+(mal?' mal':''); panel.innerHTML=panelHtml(s); panel.scrollTop=0;
  pgs.innerHTML=STEPS.map(function(_,i){return '<div class="pg'+(i===step?' on':'')+'" style="width:'+(i===step?26:8)+'px"></div>';}).join('');
  prev.disabled=step===0; next.disabled=step===N-1;
}
prev.onclick=function(){if(step>0){step--;update();}};
next.onclick=function(){if(step<N-1){step++;update();}};
update();
</script>
