<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none" role="img" aria-label="Data-centre asset management dashboard with approval flow">
  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="#f8fafc"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="680" rx="16" fill="#f1f5f9"/>
  <rect x="16" y="0" width="184" height="680" fill="#f1f5f9"/>

  <!-- Sidebar - Logo area -->
  <rect x="24" y="24" width="32" height="32" rx="8" fill="#4f46e5"/>
  <text x="64" y="46" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e293b">DC Keeper</text>

  <!-- Sidebar - Nav items -->
  <rect x="16" y="80" width="168" height="36" rx="8" fill="#4f46e5"/>
  <text x="44" y="103" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="white">Dashboard</text>
  <circle cx="28" cy="99" r="3" fill="white" opacity="0.6"/>

  <circle cx="28" cy="136" r="3" fill="#94a3b8"/>
  <text x="44" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Assets</text>
  <circle cx="28" cy="166" r="3" fill="#94a3b8"/>
  <text x="44" y="170" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Racks</text>
  <circle cx="28" cy="196" r="3" fill="#94a3b8"/>
  <text x="44" y="200" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Network</text>
  <circle cx="28" cy="226" r="3" fill="#94a3b8"/>
  <text x="44" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Power</text>
  <circle cx="28" cy="256" r="3" fill="#94a3b8"/>
  <text x="44" y="260" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Approvals</text>
  <circle cx="28" cy="286" r="3" fill="#94a3b8"/>
  <text x="44" y="290" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Users &amp; Roles</text>
  <circle cx="28" cy="316" r="3" fill="#94a3b8"/>
  <text x="44" y="320" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Import</text>
  <circle cx="28" cy="346" r="3" fill="#94a3b8"/>
  <text x="44" y="350" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Reports</text>

  <!-- KPI Card 1 - Total Assets -->
  <rect x="224" y="24" width="220" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="224" y="24" width="4" height="100" rx="2" fill="#4f46e5"/>
  <text x="244" y="52" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" font-weight="500">TOTAL ASSETS</text>
  <text x="244" y="90" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#1e293b">12,847</text>

  <!-- KPI Card 2 - Active Racks -->
  <rect x="464" y="24" width="220" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="464" y="24" width="4" height="100" rx="2" fill="#06b6d4"/>
  <text x="484" y="52" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" font-weight="500">ACTIVE RACKS</text>
  <text x="484" y="90" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#1e293b">342</text>

  <!-- KPI Card 3 - Pending Approvals -->
  <rect x="704" y="24" width="220" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="704" y="24" width="4" height="100" rx="2" fill="#f59e0b"/>
  <text x="724" y="52" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" font-weight="500">PENDING APPROVALS</text>
  <text x="724" y="90" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#1e293b">18</text>

  <!-- KPI Card 4 - Utilization -->
  <rect x="944" y="24" width="232" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="944" y="24" width="4" height="100" rx="2" fill="#10b981"/>
  <text x="964" y="52" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" font-weight="500">UTILIZATION</text>
  <text x="964" y="90" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#1e293b">87.3%</text>

  <!-- Action buttons -->
  <rect x="1040" y="148" width="80" height="28" rx="6" fill="#4f46e5"/>
  <text x="1054" y="167" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="white">+ New</text>
  <rect x="1128" y="148" width="48" height="28" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1136" y="167" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#64748b">Export</text>

  <!-- Table Header -->
  <rect x="224" y="148" width="800" height="40" rx="8" fill="#f8fafc"/>
  <text x="244" y="173" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ASSET NAME</text>
  <text x="484" y="173" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">LOCATION</text>
  <text x="700" y="173" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">STATUS</text>
  <text x="880" y="173" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ROLE</text>
  <text x="1000" y="173" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ACTION</text>

  <!-- Table Row 1 -->
  <line x1="224" y1="236" x2="1176" y2="236" stroke="#f1f5f9" stroke-width="1"/>
  <text x="244" y="217" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e293b">Dell R750 Server</text>
  <text x="484" y="217" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Rack A-14, U22</text>
  <rect x="700" y="205" width="56" height="22" rx="11" fill="#dcfce7"/>
  <text x="712" y="220" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#16a34a">Active</text>
  <text x="880" y="217" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Admin</text>
  <text x="1000" y="217" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#4f46e5">View →</text>

  <!-- Table Row 2 -->
  <rect x="224" y="236" width="952" height="48" fill="#fafbfd"/>
  <line x1="224" y1="284" x2="1176" y2="284" stroke="#f1f5f9" stroke-width="1"/>
  <text x="244" y="265" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e293b">Cisco Nexus 9336</text>
  <text x="484" y="265" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Rack B-07, U40</text>
  <rect x="700" y="253" width="68" height="22" rx="11" fill="#fef3c7"/>
  <text x="712" y="268" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#d97706">Pending</text>
  <text x="880" y="265" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Reviewer</text>
  <text x="1000" y="265" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#4f46e5">View →</text>

  <!-- Table Row 3 -->
  <line x1="224" y1="332" x2="1176" y2="332" stroke="#f1f5f9" stroke-width="1"/>
  <text x="244" y="313" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e293b">APC Smart-UPS 3kVA</text>
  <text x="484" y="313" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Rack C-01, U01</text>
  <rect x="700" y="301" width="56" height="22" rx="11" fill="#dcfce7"/>
  <text x="712" y="316" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#16a34a">Active</text>
  <text x="880" y="313" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Viewer</text>
  <text x="1000" y="313" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#4f46e5">View →</text>

  <!-- Table Row 4 -->
  <rect x="224" y="332" width="952" height="48" fill="#fafbfd"/>
  <line x1="224" y1="380" x2="1176" y2="380" stroke="#f1f5f9" stroke-width="1"/>
  <text x="244" y="361" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e293b">HPE ProLiant DL380</text>
  <text x="484" y="361" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Rack A-22, U18</text>
  <rect x="700" y="349" width="60" height="22" rx="11" fill="#e0e7ff"/>
  <text x="712" y="364" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#4f46e5">Review</text>
  <text x="880" y="361" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Initiator</text>
  <text x="1000" y="361" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#4f46e5">View →</text>

  <!-- Table Row 5 -->
  <line x1="224" y1="428" x2="1176" y2="428" stroke="#f1f5f9" stroke-width="1"/>
  <text x="244" y="409" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e293b">Juniper EX4300</text>
  <text x="484" y="409" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Rack D-03, U36</text>
  <rect x="700" y="397" width="56" height="22" rx="11" fill="#dcfce7"/>
  <text x="712" y="412" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#16a34a">Active</text>
  <text x="880" y="409" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Admin</text>
  <text x="1000" y="409" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#4f46e5">View →</text>

  <!-- Approval Flow Section -->
  <rect x="224" y="452" width="952" height="204" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="244" y="480" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">APPROVAL FLOW</text>

  <!-- Step 1 -->
  <rect x="260" y="500" width="240" height="64" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="284" cy="532" r="12" fill="#16a34a"/>
  <path d="M279 532 l3 4 l6 -8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="304" y="525" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Initiator</text>
  <text x="304" y="543" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Submit request</text>

  <!-- Arrow 1 -->
  <path d="M510 532 L540 532" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M536 528 L542 532 L536 536" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 2 -->
  <rect x="552" y="500" width="240" height="64" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <circle cx="576" cy="532" r="12" fill="#f59e0b"/>
  <path d="M571 528 L581 528 M571 532 L579 532 M571 536 L581 536" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="596" y="525" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Reviewer</text>
  <text x="596" y="543" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Verify &amp; approve</text>

  <!-- Arrow 2 -->
  <path d="M802 532 L832 532" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M828 528 L834 532 L828 536" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 3 -->
  <rect x="844" y="500" width="240" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="868" cy="532" r="12" fill="#4f46e5"/>
  <path d="M863 529 l5 5 l5 -5" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="888" y="525" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Executive</text>
  <text x="888" y="543" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Final sign-off</text>

  <!-- RBAC badges row -->
  <rect x="260" y="584" width="64" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="274" y="600" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#16a34a">RBAC</text>
  <rect x="334" y="584" width="80" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="348" y="600" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#4f46e5">4 Roles</text>
  <rect x="424" y="584" width="100" height="24" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="438" y="600" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#d97706">284 Screens</text>
  <rect x="534" y="584" width="100" height="24" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="548" y="600" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">9 Modules</text>
</svg>
