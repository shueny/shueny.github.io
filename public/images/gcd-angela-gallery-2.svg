<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fffbf5"/>
    </linearGradient>
    <linearGradient id="btnGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="featuredBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="cardShadow2" x="-4%" y="-2%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0002"/>
    </filter>
    <filter id="featuredShadow" x="-6%" y="-4%" width="112%" height="118%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#f9731620"/>
    </filter>
    <filter id="testimonialShadow" x="-2%" y="-4%" width="104%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0001"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg2)"/>

  <!-- Subtle decorative elements -->
  <circle cx="60" cy="80" r="120" fill="#f97316" opacity="0.03"/>
  <circle cx="1150" cy="600" r="100" fill="#f97316" opacity="0.03"/>

  <!-- ==================== SECTION HEADER ==================== -->
  <text x="600" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f97316" text-anchor="middle" letter-spacing="3">OUR SERVICES</text>
  <text x="600" y="100" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0f172a" text-anchor="middle">Career Services</text>
  <text x="600" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Tailored coaching packages to accelerate your international career</text>

  <!-- Decorative line under title -->
  <line x1="570" y1="145" x2="630" y2="145" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

  <!-- ==================== SERVICE CARDS ==================== -->

  <!-- Card 1: Resume & CV Review -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#ffffff" filter="url(#cardShadow2)"/>
    <!-- Icon area -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#fff7ed"/>
    <text x="52" y="62" font-size="28" text-anchor="middle">📋</text>
    <!-- Content -->
    <text x="24" y="112" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">Resume &amp; CV Review</text>
    <text x="24" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Expert review and optimization for</text>
    <text x="24" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">international job markets</text>
    <!-- Divider -->
    <line x1="24" y1="185" x2="296" y2="185" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Features -->
    <circle cx="36" cy="210" r="3" fill="#f97316" opacity="0.5"/>
    <text x="48" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">ATS-optimized formatting</text>
    <circle cx="36" cy="234" r="3" fill="#f97316" opacity="0.5"/>
    <text x="48" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Industry-specific keywords</text>
    <circle cx="36" cy="258" r="3" fill="#f97316" opacity="0.5"/>
    <text x="48" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">1-on-1 feedback session</text>
    <!-- Price -->
    <text x="24" y="295" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#0f172a">$99<tspan font-size="13" fill="#94a3b8" font-family="system-ui, sans-serif">/session</tspan></text>
    <!-- Button -->
    <rect x="200" y="275" width="96" height="36" rx="18" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="248" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f97316" text-anchor="middle">Book Now</text>
  </g>

  <!-- Card 2: Career Strategy (Featured) -->
  <g transform="translate(440, 165)">
    <!-- Featured badge -->
    <rect x="100" y="-8" width="120" height="24" rx="12" fill="url(#btnGrad2)"/>
    <text x="160" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Most Popular</text>
    <!-- Card with border -->
    <rect x="0" y="0" width="320" height="350" rx="16" fill="#ffffff" filter="url(#featuredShadow)" stroke="#f97316" stroke-width="2"/>
    <!-- Icon area -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#fff7ed"/>
    <text x="52" y="62" font-size="28" text-anchor="middle">🎯</text>
    <!-- Content -->
    <text x="24" y="112" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">Career Strategy</text>
    <text x="24" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Personalized career roadmap tailored</text>
    <text x="24" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">to your goals and strengths</text>
    <!-- Divider -->
    <line x1="24" y1="185" x2="296" y2="185" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Features -->
    <circle cx="36" cy="210" r="3" fill="#f97316"/>
    <text x="48" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Skills gap analysis</text>
    <circle cx="36" cy="234" r="3" fill="#f97316"/>
    <text x="48" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Market opportunity mapping</text>
    <circle cx="36" cy="258" r="3" fill="#f97316"/>
    <text x="48" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">90-day action plan</text>
    <circle cx="36" cy="282" r="3" fill="#f97316"/>
    <text x="48" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Follow-up email support</text>
    <!-- Price -->
    <text x="24" y="325" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#0f172a">$149<tspan font-size="13" fill="#94a3b8" font-family="system-ui, sans-serif">/session</tspan></text>
    <!-- Button (filled for featured) -->
    <rect x="192" y="303" width="104" height="36" rx="18" fill="url(#btnGrad2)"/>
    <text x="244" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Book Now</text>
  </g>

  <!-- Card 3: Interview Prep -->
  <g transform="translate(800, 180)">
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#ffffff" filter="url(#cardShadow2)"/>
    <!-- Icon area -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#fff7ed"/>
    <text x="52" y="62" font-size="28" text-anchor="middle">💼</text>
    <!-- Content -->
    <text x="24" y="112" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">Interview Prep</text>
    <text x="24" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Mock interviews and coaching for</text>
    <text x="24" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">top companies worldwide</text>
    <!-- Divider -->
    <line x1="24" y1="185" x2="296" y2="185" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Features -->
    <circle cx="36" cy="210" r="3" fill="#f97316" opacity="0.5"/>
    <text x="48" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Company-specific prep</text>
    <circle cx="36" cy="234" r="3" fill="#f97316" opacity="0.5"/>
    <text x="48" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Behavioral &amp; technical rounds</text>
    <circle cx="36" cy="258" r="3" fill="#f97316" opacity="0.5"/>
    <text x="48" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Recorded session review</text>
    <!-- Price -->
    <text x="24" y="295" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#0f172a">$129<tspan font-size="13" fill="#94a3b8" font-family="system-ui, sans-serif">/session</tspan></text>
    <!-- Button -->
    <rect x="200" y="275" width="96" height="36" rx="18" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="248" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f97316" text-anchor="middle">Book Now</text>
  </g>

  <!-- ==================== TESTIMONIAL STRIP ==================== -->
  <g transform="translate(120, 555)">
    <rect x="0" y="0" width="960" height="100" rx="16" fill="#ffffff" filter="url(#testimonialShadow)"/>

    <!-- Quote icon -->
    <text x="36" y="45" font-family="Georgia, serif" font-size="40" fill="#f97316" opacity="0.2">"</text>

    <!-- Quote text -->
    <text x="70" y="42" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#334155">Angela helped me land my dream job in Berlin!</text>
    <text x="70" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">— Maria K., Software Engineer</text>

    <!-- Star rating -->
    <g transform="translate(70, 72)">
      <text x="0" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="18" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="36" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="54" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="72" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
    </g>

    <!-- Divider -->
    <line x1="480" y1="16" x2="480" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Second testimonial snippet -->
    <text x="510" y="42" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#334155">Best investment in my career transition.</text>
    <text x="510" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">— David L., Product Manager</text>

    <!-- Star rating -->
    <g transform="translate(510, 72)">
      <text x="0" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="18" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="36" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="54" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
      <text x="72" y="14" font-size="14" fill="#f59e0b">&#9733;</text>
    </g>

    <!-- Decorative element on right -->
    <circle cx="920" cy="50" r="24" fill="#fff7ed"/>
    <text x="920" y="57" font-size="22" text-anchor="middle">🌍</text>
  </g>
</svg>