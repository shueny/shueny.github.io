function navHtml(){
  var chips=ALL_BOARDS.filter(function(b){return b.file!==OWN_FILE;}).map(function(b){return '<a class="navchip" href="'+b.file+'">'+b.num+' '+esc(b.short)+'</a>';}).join('');
  return '<div class="navlabel">看完了？跳到另一個主題</div><div class="navrow"><a class="navchip home" href="index.html">目錄</a>'+chips+'</div>';
}
function actorCls(a,on,mal){return 'actor '+[a.tone==='bad'?'bad':'',a.tone==='good'?'good':'',on?'on':'',(on&&mal)?'mal':''].filter(Boolean).join(' ');}
function noteOf(s){var nl=s.noteLabel||'駭客觀點';return {label:nl,cls:nl==='正確做法'?'lime':'orange'};}

var step=0, N=STEPS.length;
var actorsEl=document.getElementById('actors'), dot=document.getElementById('dot'), dotlbl=document.getElementById('dotlbl'),
    panel=document.getElementById('panel'), prev=document.getElementById('prev'), next=document.getElementById('next'), pgs=document.getElementById('pgs');
actorsEl.innerHTML=ACTORS.map(function(a){return '<div class="actor">'+ICONS[a.kind]+'<div class="albl">'+esc(a.label)+'</div></div>';}).join('');
function panelHtml(s){
  var n=noteOf(s);
  var h='<span class="tag lime">步驟 '+(step+1)+' / '+N+'</span><div class="ptitle">'+esc(s.title)+'</div><div class="pdesc">'+esc(s.desc)+'</div><div class="note '+n.cls+'"><span class="tag '+n.cls+'">'+n.label+'</span><span>'+esc(s.note||'')+'</span></div>';
  if(s.code) h+='<div class="code mono">'+esc(s.code)+'</div>';
  if(s.demo) h+=demoHtml(s.demo,false);
  if(SCENES[step]) h+=SCENES[step];
  if(step===N-1) h+='<div class="rule"></div><span class="tag lime">根本原因與正確做法</span><div class="pdesc strong">'+esc(FIX.cause)+'</div><div class="code mono">'+esc(FIX.fixCode)+'</div>'+navHtml();
  return h;
}
function update(){
  var s=STEPS[step], mal=isMal(s), stageW=872;
  Array.prototype.forEach.call(actorsEl.children,function(el,idx){el.className=actorCls(ACTORS[idx],(s.active||[]).indexOf(idx)>=0,mal);});
  var vis=s.dotPos!==null&&s.dotPos!==undefined;
  dot.style.display=dotlbl.style.display=vis?'':'none';
  if(vis){var x=Math.round(s.dotPos*stageW)-11; dot.style.left=x+'px'; dotlbl.style.left=Math.max(0,x-24)+'px'; dotlbl.textContent=s.dotLabel||'';}
  dot.className='dot'+(mal?' mal':''); dotlbl.className='dotlbl'+(mal?' mal':'');
  panel.className='panel'+(mal?' mal':''); panel.innerHTML=panelHtml(s); panel.scrollTop=0;
  pgs.innerHTML=STEPS.map(function(_,i){return '<div class="pg'+(i===step?' on':'')+'" style="width:'+(i===step?26:8)+'px"></div>';}).join('');
  prev.disabled=step===0; next.disabled=step===N-1;
}
prev.onclick=function(){if(step>0){step--;update();}};
next.onclick=function(){if(step<N-1){step++;update();}};
update();
</script>
</body>
</html>
