<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Toxicology research platform — mass spectrum, molecular similarity heatmap and structure rendering">
  <defs>
    <linearGradient id="txbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="txpeak" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="txsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#txbg)"/>

  <!-- spectrum panel -->
  <g filter="url(#txsoft)">
    <rect x="56" y="80" width="418" height="252" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="80" y="112" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#64748b" letter-spacing="1.5">MASS SPECTRUM · m/z</text>

  <!-- axis -->
  <path d="M84 296 H450" stroke="#334155" stroke-width="2"/>
  <path d="M84 296 V132" stroke="#334155" stroke-width="2"/>

  <!-- peaks -->
  <g fill="url(#txpeak)">
    <rect x="100" y="248" width="7" height="48" rx="3"/>
    <rect x="126" y="212" width="7" height="84" rx="3"/>
    <rect x="152" y="272" width="7" height="24" rx="3"/>
    <rect x="178" y="156" width="7" height="140" rx="3"/>
    <rect x="204" y="264" width="7" height="32" rx="3"/>
    <rect x="230" y="228" width="7" height="68" rx="3"/>
    <rect x="256" y="280" width="7" height="16" rx="3"/>
    <rect x="282" y="196" width="7" height="100" rx="3"/>
    <rect x="308" y="268" width="7" height="28" rx="3"/>
    <rect x="334" y="240" width="7" height="56" rx="3"/>
    <rect x="360" y="276" width="7" height="20" rx="3"/>
    <rect x="386" y="220" width="7" height="76" rx="3"/>
    <rect x="412" y="284" width="7" height="12" rx="3"/>
  </g>
  <!-- flagged peak -->
  <rect x="178" y="156" width="7" height="140" rx="3" fill="#f97316"/>
  <circle cx="181.5" cy="146" r="6" fill="#f97316"/>

  <!-- molecule structure -->
  <g filter="url(#txsoft)">
    <rect x="500" y="80" width="244" height="146" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="524" y="110" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#64748b" letter-spacing="1.5">STRUCTURE</text>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M576 176 l24 -14 l24 14 l0 28 l-24 14 l-24 -14 Z"/>
    <path d="M624 176 l24 -14"/>
    <path d="M648 162 l24 14"/>
    <path d="M576 176 l-24 -14"/>
  </g>
  <g fill="#f97316">
    <circle cx="672" cy="176" r="6"/>
    <circle cx="552" cy="162" r="6"/>
  </g>
  <circle cx="600" cy="218" r="6" fill="#38bdf8"/>

  <!-- similarity heatmap -->
  <g filter="url(#txsoft)">
    <rect x="500" y="242" width="244" height="90" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="524" y="270" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#64748b" letter-spacing="1.5">SIMILARITY</text>
  <g>
    <rect x="524" y="282" width="24" height="24" rx="4" fill="#0ea5e9" opacity="0.25"/>
    <rect x="552" y="282" width="24" height="24" rx="4" fill="#0ea5e9" opacity="0.55"/>
    <rect x="580" y="282" width="24" height="24" rx="4" fill="#f97316" opacity="0.95"/>
    <rect x="608" y="282" width="24" height="24" rx="4" fill="#0ea5e9" opacity="0.35"/>
    <rect x="636" y="282" width="24" height="24" rx="4" fill="#0ea5e9" opacity="0.75"/>
    <rect x="664" y="282" width="24" height="24" rx="4" fill="#0ea5e9" opacity="0.2"/>
    <rect x="692" y="282" width="24" height="24" rx="4" fill="#f97316" opacity="0.7"/>
  </g>

  <!-- title -->
  <text x="56" y="392" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="800" fill="#f1f5f9">Toxicology Research Platform</text>
  <text x="56" y="418" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="600" fill="#64748b">Spectral analysis · molecular similarity · report export</text>
  <text x="744" y="418" text-anchor="end" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Nuxt 3</text>
</svg>
