<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <filter id="phoneShadow1" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#1a202c" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="timerRingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#c53030"/>
    </linearGradient>
    <clipPath id="screenClip1">
      <rect x="383" y="38" width="434" height="604" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad1)"/>

  <!-- Subtle decorative circles -->
  <circle cx="180" cy="120" r="80" fill="#fed7d7" opacity="0.3"/>
  <circle cx="1020" cy="560" r="100" fill="#fed7d7" opacity="0.25"/>
  <circle cx="950" cy="100" r="50" fill="#fff5f5" opacity="0.5"/>
  <circle cx="250" cy="550" r="60" fill="#fff5f5" opacity="0.4"/>

  <!-- Phone frame -->
  <g filter="url(#phoneShadow1)">
    <rect x="375" y="10" width="450" height="660" rx="36" ry="36" fill="#1a202c"/>
    <rect x="383" y="18" width="434" height="644" rx="30" ry="30" fill="#ffffff"/>
  </g>

  <!-- Status bar -->
  <g clip-path="url(#screenClip1)">
    <!-- Status bar background -->
    <rect x="383" y="18" width="434" height="36" fill="#ffffff"/>
    <text x="410" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#718096" font-weight="500">9:41</text>
    <!-- Signal, WiFi, Battery icons (simplified) -->
    <g transform="translate(760, 32)">
      <!-- Signal bars -->
      <rect x="0" y="4" width="3" height="6" rx="1" fill="#718096"/>
      <rect x="5" y="2" width="3" height="8" rx="1" fill="#718096"/>
      <rect x="10" y="0" width="3" height="10" rx="1" fill="#718096"/>
      <rect x="15" y="-2" width="3" height="12" rx="1" fill="#718096"/>
      <!-- Battery -->
      <rect x="28" y="0" width="20" height="10" rx="2" fill="none" stroke="#718096" stroke-width="1.2"/>
      <rect x="48" y="3" width="2" height="4" rx="1" fill="#718096"/>
      <rect x="30" y="2" width="14" height="6" rx="1" fill="#48bb78"/>
    </g>

    <!-- App header -->
    <rect x="383" y="54" width="434" height="56" fill="#ffffff"/>
    <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#1a202c" font-weight="700" text-anchor="middle">🍅 Daily Tomato</text>

    <!-- Timer section background -->
    <rect x="383" y="110" width="434" height="380" fill="#fff5f5"/>

    <!-- Session indicator -->
    <text x="600" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e53e3e" font-weight="600" text-anchor="middle" letter-spacing="1.5">FOCUS SESSION</text>

    <!-- Session dots -->
    <circle cx="564" cy="165" r="6" fill="#e53e3e"/>
    <circle cx="584" cy="165" r="6" fill="#e53e3e"/>
    <circle cx="604" cy="165" r="6" fill="#e53e3e"/>
    <circle cx="624" cy="165" r="6" fill="none" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="600" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a0aec0" text-anchor="middle">3 of 4 sessions</text>

    <!-- Circular timer -->
    <g transform="translate(600, 310)">
      <!-- Outer glow -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#fed7d7" stroke-width="3" opacity="0.5"/>

      <!-- Background track -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>

      <!-- Progress ring (75% = 270 degrees) -->
      <!-- circumference = 2 * PI * 100 = 628.318 -->
      <!-- 75% = 471.24 filled, 157.08 gap -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="url(#timerRingGrad)" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="471.24 157.08"
              transform="rotate(-90)"/>

      <!-- Progress end dot -->
      <circle cx="0" cy="-100" r="6" fill="#e53e3e" transform="rotate(180)"/>

      <!-- Inner circle background -->
      <circle cx="0" cy="0" r="85" fill="#ffffff" opacity="0.7"/>

      <!-- Timer text -->
      <text x="0" y="-8" font-family="'SF Mono', 'Fira Code', monospace" font-size="48" fill="#1a202c" font-weight="700" text-anchor="middle">18:42</text>
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a0aec0" text-anchor="middle">remaining</text>
    </g>

    <!-- Current task label -->
    <rect x="440" y="430" width="320" height="40" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="460" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#718096">📋</text>
    <text x="485" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4a5568" font-weight="500">Design homepage layout</text>

    <!-- Action buttons -->
    <!-- Pause button -->
    <rect x="430" y="490" width="140" height="44" rx="22" fill="#e53e3e"/>
    <g transform="translate(475, 512)">
      <!-- Pause icon -->
      <rect x="-6" y="-8" width="4" height="16" rx="1" fill="#ffffff"/>
      <rect x="2" y="-8" width="4" height="16" rx="1" fill="#ffffff"/>
    </g>
    <text x="498" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="left">Pause</text>

    <!-- Skip button -->
    <rect x="590" y="490" width="140" height="44" rx="22" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(635, 512)">
      <!-- Skip icon -->
      <polygon points="-6,-7 4,0 -6,7" fill="#718096"/>
      <rect x="5" y="-7" width="3" height="14" rx="1" fill="#718096"/>
    </g>
    <text x="655" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4a5568" font-weight="600">Skip</text>

    <!-- Bottom tab bar -->
    <rect x="383" y="580" width="434" height="82" fill="#ffffff"/>
    <line x1="383" y1="580" x2="817" y2="580" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Timer tab (active) -->
    <g transform="translate(478, 602)">
      <circle cx="0" cy="0" r="3" fill="#e53e3e"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#e53e3e" stroke-width="1.5"/>
      <!-- Clock hands -->
      <line x1="0" y1="0" x2="0" y2="-7" stroke="#e53e3e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="5" y2="2" stroke="#e53e3e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#e53e3e" font-weight="600" text-anchor="middle">Timer</text>
    </g>

    <!-- Tasks tab -->
    <g transform="translate(600, 602)">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
      <line x1="-5" y1="-3" x2="5" y2="-3" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="3" x2="5" y2="3" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round"/>
      <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a0aec0" font-weight="500" text-anchor="middle">Tasks</text>
    </g>

    <!-- Stats tab -->
    <g transform="translate(722, 602)">
      <rect x="-8" y="4" width="5" height="8" rx="1" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
      <rect x="-2" y="-2" width="5" height="14" rx="1" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
      <rect x="4" y="-8" width="5" height="20" rx="1" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
      <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a0aec0" font-weight="500" text-anchor="middle">Stats</text>
    </g>

    <!-- Home indicator -->
    <rect x="560" y="648" width="80" height="4" rx="2" fill="#cbd5e0"/>
  </g>

  <!-- Decorative small tomatoes -->
  <g transform="translate(280, 280)" opacity="0.15">
    <circle cx="0" cy="0" r="20" fill="#e53e3e"/>
    <ellipse cx="0" cy="-18" rx="8" ry="5" fill="#48bb78"/>
  </g>
  <g transform="translate(920, 380)" opacity="0.15">
    <circle cx="0" cy="0" r="16" fill="#e53e3e"/>
    <ellipse cx="0" cy="-14" rx="6" ry="4" fill="#48bb78"/>
  </g>
  <g transform="translate(160, 420)" opacity="0.1">
    <circle cx="0" cy="0" r="14" fill="#e53e3e"/>
    <ellipse cx="0" cy="-12" rx="5" ry="3" fill="#48bb78"/>
  </g>
  <g transform="translate(1050, 200)" opacity="0.12">
    <circle cx="0" cy="0" r="18" fill="#e53e3e"/>
    <ellipse cx="0" cy="-16" rx="7" ry="4" fill="#48bb78"/>
  </g>
</svg>