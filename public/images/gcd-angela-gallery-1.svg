<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="portraitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="portraitClip">
      <circle cx="920" cy="380" r="170"/>
    </clipPath>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0001"/>
    </filter>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#heroBg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(700,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(800,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(900,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(1000,0)"/>
    <line x1="0" y1="0" x2="0" y2="680" stroke="#94a3b8" stroke-width="1" transform="translate(1100,0)"/>
  </g>

  <!-- ==================== NAV BAR ==================== -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Logo -->
  <circle cx="76" cy="32" r="14" fill="#f97316" opacity="0.15"/>
  <text x="68" y="37" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#f97316">A</text>
  <text x="96" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Angela Career Path</text>

  <!-- Nav links -->
  <text x="520" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Services</text>
  <text x="610" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">About</text>
  <text x="685" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Testimonials</text>
  <text x="800" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Contact</text>

  <!-- CTA Button -->
  <rect x="920" y="16" width="200" height="36" rx="18" fill="url(#btnGrad)"/>
  <text x="1020" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Book Consultation</text>

  <!-- ==================== HERO SECTION ==================== -->

  <!-- Left Content -->
  <!-- Small label -->
  <rect x="80" y="140" width="180" height="28" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="170" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#ea580c" text-anchor="middle">✦ Career Coaching Expert</text>

  <!-- Main heading -->
  <text x="80" y="220" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#0f172a">Discover Your</text>
  <text x="80" y="272" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#0f172a">Global Career</text>
  <text x="80" y="324" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#f97316">Path</text>

  <!-- Subtext -->
  <text x="80" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">Professional career coaching for international talent.</text>
  <text x="80" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">Navigate your dream career with confidence.</text>

  <!-- CTA Buttons -->
  <rect x="80" y="425" width="220" height="48" rx="24" fill="url(#btnGrad)"/>
  <text x="190" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Book Free Consultation</text>

  <rect x="320" y="425" width="160" height="48" rx="24" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f97316" text-anchor="middle">View Services</text>

  <!-- Stat badges -->
  <g transform="translate(80, 510)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="150" height="70" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="75" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f97316" text-anchor="middle">200+</text>
    <text x="75" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Clients Coached</text>

    <!-- Stat 2 -->
    <rect x="170" y="0" width="150" height="70" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="245" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f97316" text-anchor="middle">15</text>
    <text x="245" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Countries</text>

    <!-- Stat 3 -->
    <rect x="340" y="0" width="150" height="70" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="415" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f97316" text-anchor="middle">98%</text>
    <text x="415" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Satisfaction</text>
  </g>

  <!-- ==================== RIGHT SIDE — Portrait Area ==================== -->

  <!-- Large decorative circle behind portrait -->
  <circle cx="920" cy="370" r="195" fill="#fff7ed" opacity="0.6"/>
  <circle cx="920" cy="370" r="175" fill="#ffedd5" opacity="0.5"/>

  <!-- Portrait circle -->
  <circle cx="920" cy="360" r="140" fill="url(#portraitGrad)"/>

  <!-- Stylized professional silhouette -->
  <g transform="translate(920, 360)" opacity="0.55">
    <!-- Head -->
    <circle cx="0" cy="-65" r="40" fill="#ea580c"/>
    <!-- Shoulders -->
    <path d="M-70 20 Q-70 -20 -30 -30 Q0 -35 0 -25 Q0 -35 30 -30 Q70 -20 70 20 L70 80 Q70 100 50 100 L-50 100 Q-70 100 -70 80 Z" fill="#ea580c"/>
    <!-- Collar detail -->
    <path d="M-15 -25 L0 5 L15 -25" fill="none" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <!-- Decorative dots — top right cluster -->
  <g filter="url(#dotGlow)">
    <circle cx="1100" cy="160" r="6" fill="#f97316" opacity="0.3"/>
    <circle cx="1120" cy="180" r="4" fill="#f97316" opacity="0.2"/>
    <circle cx="1080" cy="185" r="8" fill="#fb923c" opacity="0.15"/>
    <circle cx="1130" cy="150" r="3" fill="#f97316" opacity="0.25"/>
    <circle cx="1090" cy="140" r="5" fill="#fdba74" opacity="0.3"/>
  </g>

  <!-- Decorative dots — right side scattered -->
  <circle cx="1140" cy="320" r="5" fill="#f97316" opacity="0.15"/>
  <circle cx="1155" cy="350" r="3" fill="#f97316" opacity="0.2"/>
  <circle cx="1130" cy="400" r="7" fill="#fb923c" opacity="0.1"/>
  <circle cx="1150" cy="440" r="4" fill="#f97316" opacity="0.18"/>

  <!-- Decorative dots — around portrait -->
  <circle cx="740" cy="250" r="8" fill="#f97316" opacity="0.12"/>
  <circle cx="760" cy="480" r="6" fill="#fb923c" opacity="0.15"/>
  <circle cx="1080" cy="500" r="5" fill="#f97316" opacity="0.12"/>
  <circle cx="1060" cy="250" r="4" fill="#fdba74" opacity="0.2"/>

  <!-- Small accent shapes -->
  <rect x="750" y="300" width="16" height="16" rx="4" fill="#f97316" opacity="0.08" transform="rotate(45, 758, 308)"/>
  <rect x="1070" cy="460" width="12" height="12" rx="3" fill="#fb923c" opacity="0.1" transform="rotate(30, 1076, 466)"/>

  <!-- Floating accent rings -->
  <circle cx="780" cy="200" r="18" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.1"/>
  <circle cx="1070" cy="520" r="14" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.12"/>

  <!-- Bottom decorative wave -->
  <path d="M0 650 Q300 630 600 650 Q900 670 1200 645 L1200 680 L0 680 Z" fill="#fff7ed" opacity="0.5"/>
</svg>