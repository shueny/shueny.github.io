      <rect x="576" y="0" width="176" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="576" y="0" width="176" height="4" rx="12 12 0 0" fill="#ec4899"/>
      <text x="592" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ec4899">NOUN · FEMININ</text>
      <text x="592" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">die Rechnung</text>
      <text x="592" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">bill / invoice</text>
      <line x1="592" y1="94" x2="736" y2="94" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="592" y="104" width="80" height="18" rx="9" fill="#fef9c3"/>
      <text x="632" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#ca8a04" text-anchor="middle">Learning</text>

      <!-- Card 5: der Ausgang -->
      <rect x="0" y="146" width="176" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="146" width="176" height="4" rx="12 12 0 0" fill="#4f46e5"/>
      <text x="16" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#4f46e5">NOUN · MASKULIN</text>
      <text x="16" y="206" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">der Ausgang</text>
      <text x="16" y="226" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">exit</text>
      <line x1="16" y1="240" x2="160" y2="240" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="16" y="250" width="80" height="18" rx="9" fill="#fee2e2"/>
      <text x="56" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">New</text>

      <!-- Card 6: die Fahrkarte -->
      <rect x="192" y="146" width="176" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="192" y="146" width="176" height="4" rx="12 12 0 0" fill="#ec4899"/>
      <text x="208" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ec4899">NOUN · FEMININ</text>
      <text x="208" y="206" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">die Fahrkarte</text>
      <text x="208" y="226" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">ticket</text>
      <line x1="208" y1="240" x2="352" y2="240" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="208" y="250" width="80" height="18" rx="9" fill="#fee2e2"/>
      <text x="248" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">New</text>
    </g>

    <!-- Right sidebar: Daily Goals -->
    <rect x="920" y="204" width="240" height="444" rx="0" fill="#f8fafc"/>
    <line x1="920" y1="204" x2="920" y2="660" stroke="#e2e8f0" stroke-width="1"/>

    <text x="944" y="236" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Daily Goals</text>
    <text x="944" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Today's progress</text>

    <!-- Speaking goal -->
    <g transform="translate(944, 274)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">🎙 Speaking</text>
      <text x="176" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4f46e5" text-anchor="end">15/20 min</text>
      <rect x="0" y="22" width="176" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="0" y="22" width="132" height="8" rx="4" fill="#4f46e5"/>
      <text x="176" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">75%</text>
    </g>

    <!-- Listening goal -->
    <g transform="translate(944, 334)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">🎧 Listening</text>
      <text x="176" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e" text-anchor="end">20/20 min</text>
      <rect x="0" y="22" width="176" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="0" y="22" width="176" height="8" rx="4" fill="#22c55e"/>
      <text x="176" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="end">Complete! ✓</text>
    </g>

    <!-- Reading goal -->
    <g transform="translate(944, 394)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">📖 Reading</text>
      <text x="176" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="end">8/15 min</text>
      <rect x="0" y="22" width="176" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="0" y="22" width="94" height="8" rx="4" fill="#f59e0b"/>
      <text x="176" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">53%</text>
    </g>

    <!-- Writing goal -->
    <g transform="translate(944, 454)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">✏️ Writing</text>
      <text x="176" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="end">3/15 min</text>
      <rect x="0" y="22" width="176" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="0" y="22" width="35" height="8" rx="4" fill="#ef4444"/>
      <text x="176" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">20%</text>
    </g>

    <!-- Weekly summary box -->
    <g transform="translate(944, 520)">
      <rect x="0" y="0" width="192" height="100" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338ca">Weekly Summary</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Practice time: 4.2 hrs</text>
      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">New words: 12</text>
      <text x="16" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Conversations: 8</text>
    </g>
