<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Content prioritization for AI search — scoring page types on six criteria">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- faint dots -->
  <g fill="#ea580c" opacity="0.12">
    <circle cx="62" cy="392" r="5"/><circle cx="112" cy="418" r="3"/><circle cx="726" cy="64" r="6"/>
    <circle cx="762" cy="112" r="3"/><circle cx="690" cy="398" r="4"/><circle cx="92" cy="64" r="4"/>
  </g>

  <!-- scorecard -->
  <g filter="url(#soft)">
    <rect x="70" y="86" width="392" height="276" rx="20" fill="#ffffff"/>
  </g>
  <rect x="70" y="86" width="392" height="50" rx="20" fill="#ffedd5"/>
  <rect x="70" y="116" width="392" height="20" fill="#ffedd5"/>
  <text x="94" y="118" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">Score every topic on 6 criteria</text>

  <!-- column dots header -->
  <g fill="#d6d3d1">
    <circle cx="286" cy="162" r="4"/><circle cx="316" cy="162" r="4"/><circle cx="346" cy="162" r="4"/>
    <circle cx="376" cy="162" r="4"/><circle cx="406" cy="162" r="4"/><circle cx="436" cy="162" r="4"/>
  </g>

  <!-- row 1 -->
  <rect x="94" y="188" width="150" height="12" rx="6" fill="#1c1917"/>
  <g fill="#ea580c">
    <circle cx="286" cy="194" r="7"/><circle cx="316" cy="194" r="7"/><circle cx="346" cy="194" r="7"/>
    <circle cx="376" cy="194" r="7"/><circle cx="406" cy="194" r="7"/>
  </g>
  <circle cx="436" cy="194" r="7" fill="#fed7aa"/>

  <!-- row 2 -->
  <rect x="94" y="234" width="118" height="12" rx="6" fill="#57534e"/>
  <g fill="#ea580c">
    <circle cx="286" cy="240" r="7"/><circle cx="316" cy="240" r="7"/><circle cx="346" cy="240" r="7"/>
  </g>
  <g fill="#fed7aa">
    <circle cx="376" cy="240" r="7"/><circle cx="406" cy="240" r="7"/><circle cx="436" cy="240" r="7"/>
  </g>

  <!-- row 3 -->
  <rect x="94" y="280" width="134" height="12" rx="6" fill="#a8a29e"/>
  <g fill="#ea580c">
    <circle cx="286" cy="286" r="7"/>
  </g>
  <g fill="#fed7aa">
    <circle cx="316" cy="286" r="7"/><circle cx="346" cy="286" r="7"/>
    <circle cx="376" cy="286" r="7"/><circle cx="406" cy="286" r="7"/><circle cx="436" cy="286" r="7"/>
  </g>

  <!-- row 4 -->
  <rect x="94" y="326" width="98" height="12" rx="6" fill="#d6d3d1"/>
  <g fill="#fed7aa">
    <circle cx="286" cy="332" r="7"/><circle cx="316" cy="332" r="7"/><circle cx="346" cy="332" r="7"/>
    <circle cx="376" cy="332" r="7"/><circle cx="406" cy="332" r="7"/><circle cx="436" cy="332" r="7"/>
  </g>

  <!-- priority bands -->
  <g filter="url(#soft)">
    <rect x="506" y="86" width="224" height="276" rx="20" fill="#ffffff"/>
  </g>

  <rect x="530" y="118" width="176" height="66" rx="14" fill="url(#hot)"/>
  <text x="552" y="148" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff7ed">HIGH</text>
  <rect x="552" y="158" width="118" height="9" rx="4.5" fill="#ffffff" opacity="0.75"/>

  <rect x="530" y="196" width="176" height="66" rx="14" fill="#fdba74"/>
  <text x="552" y="226" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="800" fill="#7c2d12">RE-EVALUATE</text>
  <rect x="552" y="236" width="92" height="9" rx="4.5" fill="#ffffff" opacity="0.75"/>

  <rect x="530" y="274" width="176" height="66" rx="14" fill="#f5f5f4"/>
  <text x="552" y="304" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="800" fill="#a8a29e">LOW</text>
  <rect x="552" y="314" width="64" height="9" rx="4.5" fill="#d6d3d1"/>

  <!-- title -->
  <text x="70" y="412" font-family="Outfit, Arial, sans-serif" font-size="27" font-weight="800" fill="#1c1917">Content Prioritization for AI Search</text>
  <text x="730" y="412" text-anchor="end" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">SEO · GEO</text>
</svg>
