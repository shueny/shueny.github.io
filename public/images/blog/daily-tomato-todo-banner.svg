<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Daily Tomato Todo — Vue 3 daily planner with Pomodoro focus timer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="1" stop-color="#F03E2E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8a6a00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- faint pattern dots -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="60" cy="380" r="5"/><circle cx="110" cy="410" r="3"/><circle cx="720" cy="70" r="6"/>
    <circle cx="760" cy="120" r="3"/><circle cx="680" cy="390" r="4"/><circle cx="90" cy="70" r="4"/>
  </g>

  <!-- todo card -->
  <g filter="url(#soft)">
    <rect x="88" y="96" width="330" height="258" rx="22" fill="#FFFDF6"/>
  </g>
  <!-- card header bar -->
  <rect x="88" y="96" width="330" height="54" rx="22" fill="#FFF3CC"/>
  <rect x="88" y="128" width="330" height="22" fill="#FFF3CC"/>
  <text x="112" y="131" font-family="Nunito, Arial, sans-serif" font-size="21" font-weight="800" fill="#8a6a00">7/6 Mon · Today</text>

  <!-- row 1: done -->
  <rect x="112" y="172" width="26" height="26" rx="8" fill="#FFCC22"/>
  <path d="M119 185 l6 6 l10 -12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="152" y="179" width="150" height="12" rx="6" fill="#D9D2BE"/>
  <!-- row 2: active with tomato count -->
  <rect x="112" y="220" width="26" height="26" rx="8" fill="#EDE7D8"/>
  <rect x="152" y="227" width="190" height="12" rx="6" fill="#5B5347"/>
  <circle cx="368" cy="233" r="9" fill="url(#tomato)"/>
  <!-- row 3 -->
  <rect x="112" y="268" width="26" height="26" rx="8" fill="#EDE7D8"/>
  <rect x="152" y="275" width="120" height="12" rx="6" fill="#B7AE97"/>
  <!-- row 4 -->
  <rect x="112" y="316" width="26" height="26" rx="8" fill="#EDE7D8"/>
  <rect x="152" y="323" width="165" height="12" rx="6" fill="#B7AE97"/>

  <!-- big tomato timer -->
  <g filter="url(#soft)">
    <circle cx="580" cy="240" r="118" fill="#FFFDF6"/>
  </g>
  <!-- progress ring -->
  <circle cx="580" cy="240" r="96" fill="none" stroke="#F5EDD6" stroke-width="13"/>
  <path d="M 580 144 A 96 96 0 1 1 493 285" fill="none" stroke="url(#tomato)" stroke-width="13" stroke-linecap="round"/>
  <!-- tomato body -->
  <circle cx="580" cy="252" r="52" fill="url(#tomato)"/>
  <ellipse cx="562" cy="236" rx="14" ry="9" fill="#ffffff" opacity="0.35"/>
  <!-- leaves -->
  <path d="M580 204 q-6 -16 4 -26 q4 12 -4 26" fill="#2E8B3D"/>
  <path d="M580 206 q-20 -12 -38 -4 q14 14 38 4 M580 206 q20 -12 38 -4 q-14 14 -38 4" fill="#3DA04F"/>
  <!-- timer text -->
  <text x="580" y="266" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFDF6">25:00</text>

  <!-- title -->
  <text x="88" y="415" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="800" fill="#5c4a06">Daily Tomato Todo</text>
  <text x="712" y="415" text-anchor="end" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a6a00">Vue 3 + Pinia</text>
</svg>
