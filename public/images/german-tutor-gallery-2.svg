      <rect x="384" y="0" width="176" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="384" y="0" width="176" height="4" rx="12 12 0 0" fill="#f59e0b"/>
      <text x="400" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#f59e0b">NOUN · NEUTRAL</text>
      <text x="400" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">das Gepäck</text>
      <text x="400" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">luggage</text>
      <line x1="400" y1="94" x2="544" y2="94" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="400" y="104" width="80" height="18" rx="9" fill="#fef9c3"/>
      <text x="440" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#ca8a04" text-anchor="middle">Learning</text>

