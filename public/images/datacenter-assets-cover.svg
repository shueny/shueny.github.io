<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Data-centre asset management platform with a three-stage approval flow">
  <defs>
    <linearGradient id="dcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="dcaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="dcsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dcbg)"/>

  <!-- faint grid -->
  <g stroke="#f97316" stroke-width="1" opacity="0.07">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- rack cabinets -->
  <g filter="url(#dcsoft)">
    <rect x="64" y="96" width="104" height="238" rx="10" fill="#0c0a09" stroke="#44403c" stroke-width="2"/>
    <rect x="184" y="96" width="104" height="238" rx="10" fill="#0c0a09" stroke="#44403c" stroke-width="2"/>
    <rect x="304" y="96" width="104" height="238" rx="10" fill="#0c0a09" stroke="#44403c" stroke-width="2"/>
  </g>

  <!-- rack units -->
  <g>
    <!-- rack 1 -->
    <rect x="78" y="112" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="78" y="136" width="76" height="16" rx="4" fill="#ea580c"/>
    <rect x="78" y="160" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="78" y="184" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="78" y="208" width="76" height="16" rx="4" fill="#22c55e"/>
    <rect x="78" y="232" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="78" y="256" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="78" y="280" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="78" y="304" width="76" height="16" rx="4" fill="#ea580c"/>
    <!-- rack 2 -->
    <rect x="198" y="112" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="198" y="136" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="198" y="160" width="76" height="16" rx="4" fill="#22c55e"/>
    <rect x="198" y="184" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="198" y="208" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="198" y="232" width="76" height="16" rx="4" fill="#ea580c"/>
    <rect x="198" y="256" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="198" y="280" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="198" y="304" width="76" height="16" rx="4" fill="#3f3f46"/>
    <!-- rack 3 -->
    <rect x="318" y="112" width="76" height="16" rx="4" fill="#ea580c"/>
    <rect x="318" y="136" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="318" y="160" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="318" y="184" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="318" y="208" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="318" y="232" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="318" y="256" width="76" height="16" rx="4" fill="#22c55e"/>
    <rect x="318" y="280" width="76" height="16" rx="4" fill="#3f3f46"/>
    <rect x="318" y="304" width="76" height="16" rx="4" fill="#3f3f46"/>
  </g>

  <!-- approval flow panel -->
  <g filter="url(#dcsoft)">
    <rect x="464" y="96" width="272" height="238" rx="16" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
  </g>
  <text x="492" y="134" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="800" fill="#a8a29e" letter-spacing="1.5">APPROVAL FLOW</text>

  <!-- stage 1 -->
  <circle cx="504" cy="176" r="15" fill="url(#dcaccent)"/>
  <path d="M497 176 l5 5 l9 -11" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="532" y="169" width="118" height="10" rx="5" fill="#57534e"/>
  <rect x="532" y="185" width="72" height="7" rx="3.5" fill="#3f3f46"/>
  <path d="M504 191 V213" stroke="#44403c" stroke-width="2"/>

  <!-- stage 2 -->
  <circle cx="504" cy="228" r="15" fill="url(#dcaccent)"/>
  <path d="M497 228 l5 5 l9 -11" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="532" y="221" width="140" height="10" rx="5" fill="#57534e"/>
  <rect x="532" y="237" width="90" height="7" rx="3.5" fill="#3f3f46"/>
  <path d="M504 243 V265" stroke="#44403c" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- stage 3 (optional) -->
  <circle cx="504" cy="280" r="15" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="532" y="273" width="104" height="10" rx="5" fill="#3f3f46"/>
  <rect x="532" y="289" width="128" height="7" rx="3.5" fill="#292524"/>

  <!-- role masking chip -->
  <rect x="656" y="266" width="56" height="28" rx="14" fill="#292524" stroke="#57534e" stroke-width="1.5"/>
  <text x="684" y="285" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="800" fill="#ea580c">***</text>

  <!-- title -->
  <text x="64" y="398" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="800" fill="#fafaf9">Data-Centre Assets</text>
  <text x="64" y="424" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="600" fill="#a8a29e">Client platform · 9 modules · 284 screens · RBAC</text>
  <text x="736" y="424" text-anchor="end" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea580c">React 18</text>
</svg>
