rrentColor\" stroke-width=\"1.7\"><path d=\"M8 6l-5 6 5 6M16 6l5 6-5 6\"></path></svg>", "lock": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg>", "window": "<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\"></rect><path d=\"M3 8h18\"></path><circle cx=\"6\" cy=\"6\" r=\"0.6\" fill=\"currentColor\" stroke=\"none\"></circle><circle cx=\"8.5\" cy=\"6\" r=\"0.6\" fill=\"currentColor\" stroke=\"none\"></circle></svg>"}, SCENES={"0": "<div class=\"bw\" style=\"max-width:400px\">\n  <div class=\"bw-bar\" style=\"background:#A8DEFF;justify-content:space-between\"><b style=\"font-size:13px\">Wi-Fi</b><span class=\"badge ok\">開啟</span></div>\n  <div style=\"position:relative\">\n    <div class=\"wrow\"><span>Home_5G</span><span style=\"display:flex;gap:6px;align-items:center;color:#5A4E7C;font-size:11px\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg> 已加密</span></div>\n    <div class=\"wrow\" style=\"border-bottom:1px solid #9ED8FF\"><div class=\"fadein\" style=\"position:absolute;left:0;right:0;top:0;bottom:0;background:#FFC93C;opacity:0;animation:scRowOn .3s ease-out 1.3s forwards\"></div><span style=\"position:relative\">Free_Cafe_WiFi</span><span style=\"position:relative;display:flex;gap:8px;align-items:center;font-size:11px\"><span class=\"badge bad\">開放網路 · 沒有密碼</span><span class=\"badge ok fadein\" style=\"animation-delay:1.5s;border:1.5px solid #222034\">已連線</span></span></div>\n    <div class=\"wrow\" style=\"border-bottom:none\"><span>Office-Guest</span><span style=\"display:flex;gap:6px;align-items:center;color:#5A4E7C;font-size:11px\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg> 已加密</span></div>\n  </div>\n  <div class=\"scn-cursor\" style=\"--x0:330px;--y0:150px;--x1:150px;--y1:98px\"></div>\n  <div class=\"scn-ripple\" style=\"--x1:150px;--y1:98px;animation-delay:1.2s\"></div>\n</div>", "4": "<div class=\"bw\">\n  <div class=\"bw-top\"><div class=\"bw-tab on\">我的購物網站</div></div>\n  <div class=\"bw-bar\"><span class=\"lk\" style=\"position:relative;width:14px;height:14px\"><span style=\"position:absolute;animation:scOut .3s ease-out 1.3s forwards\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg></span><span class=\"fadein\" style=\"position:absolute;color:#D7263D;animation-delay:1.4s\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"M12 3l10 18H2z\"></path><path d=\"M12 10v5M12 18v.6\"></path></svg></span></span><div class=\"bw-url\">https://shop.example.com</div><span style=\"position:relative;width:150px;height:20px;display:inline-block\"><span class=\"badge ok\" style=\"position:absolute;right:0;animation:scOut .3s ease-out 1.3s forwards\">安全</span><span class=\"badge bad fadein\" style=\"position:absolute;right:0;animation-delay:1.4s\">部分內容不安全</span></span></div>\n  <div class=\"bw-body\" style=\"min-height:110px\"><div class=\"fadein\" style=\"display:flex;gap:8px;align-items:center;margin-bottom:8px;animation-delay:0.2s\"><span class=\"badge ok\">已加密</span><span style=\"font-size:12.5px;font-weight:600\">頁面本身 https://shop.example.com</span></div><div class=\"fadein\" style=\"display:flex;gap:8px;align-items:center;margin-bottom:8px;animation-delay:1.0s\"><span class=\"badge bad\">未加密</span><span style=\"font-size:12.5px;font-weight:600\">圖片 http://cdn.example.com/photo.jpg</span></div></div>\n</div>"};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var MAL='#D7263D';
function isMal(s){return String(s.dotColor||'').toUpperCase()===MAL;}
function demoHtml(d,sm){
  var tabs=d.tabs.map(function(t){return '<div class="dtd-tab'+(t.active?' active':'')+'">'+esc(t.label)+'</div>';}).join('');
  return '<div class="dtd-panel"'+(sm?' style="padding:10px 10px 9px;min-height:76px"':'')+'><div class="dtd-chrome">'+tabs+'</div><div class="dtd-cursor"></div><div class="dtd-click"></div><div class="dtd-line" style="'+(sm?'font-size:10px;':'')+'--dtd-w:'+(d.line.length+3)+'ch">'+esc(d.line)+'</div><div class="dtd-result"'+(sm?' style="font-size:10px"':'')+'>'+esc(d.result)+'</div></div>';
}
function navHtml(){
  var chips=ALL_BOARDS.filter(function(b){return b.file!==OWN_FILE;}).map(function(b){return '<a class="navchip" href="'+b.file+'">'+b.num+' '+esc(b.short)+'</a>';}).join('');
  return '<div class="navlabel">看完了？跳到另一個主題</div><div class="navrow"><a class="navchip home" href="index.html">目錄</a>'+chips+'</div>';
}
function actorCls(a,on,mal){return 'actor '+[a.tone==='bad'?'bad':'',a.tone==='good'?'good':'',on?'on':'',(on&&mal)?'mal':''].filter(Boolean).join(' ');}
function noteOf(s){var nl=s.noteLabel||'駭客觀點';return {label:nl,cls:nl==='正確做法'?'lime':'orange'};}

var step=0, N=STEPS.length;
var actorsEl=document.getElementById('actors'), dot=document.getElementById('dot'), dotlbl=document.getElementById('dotlbl'),
    panel=document.getElementById('panel'), prev=document.getElementById('prev'), next=document.getElementById('next'), pgs=document.getElementById('pgs');
actorsEl.innerHTML=ACTORS.map(function(a){return '<div class="actor">'+ICONS[a.kind]+'<div class="albl">'+esc(a.label)+'</div></div>';}).join('');
function panelHtml(s){
  var n=noteOf(s);
  var h='<span class="tag lime">步驟 '+(step+1)+' / '+N+'</span><div class="ptitle">'+esc(s.title)+'</div><div class="pdesc">'+esc(s.desc)+'</div><div class="note '+n.cls+'"><span class="tag '+n.cls+'">'+n.label+'</span><span>'+esc(s.note||'')+'</span></div>';
  if(s.code) h+='<div class="code mono">'+esc(s.code)+'</div>';
  if(s.demo) h+=demoHtml(s.demo,false);
  if(SCENES[step]) h+=SCENES[step];
  if(step===N-1) h+='<div class="rule"></div><span class="tag lime">根本原因與正確做法</span><div class="pdesc strong">'+esc(FIX.cause)+'</div><div class="code mono">'+esc(FIX.fixCode)+'</div>'+navHtml();
  return h;
}
function update(){
  var s=STEPS[step], mal=isMal(s), stageW=872;
  Array.prototype.forEach.call(actorsEl.children,function(el,idx){el.className=actorCls(ACTORS[idx],(s.active||[]).indexOf(idx)>=0,mal);});
  var vis=s.dotPos!==null&&s.dotPos!==undefined;
  dot.style.display=dotlbl.style.display=vis?'':'none';
  if(vis){var x=Math.round(s.dotPos*stageW)-11; dot.style.left=x+'px'; dotlbl.style.left=Math.max(0,x-24)+'px'; dotlbl.textContent=s.dotLabel||'';}
  dot.className='dot'+(mal?' mal':''); dotlbl.className='dotlbl'+(mal?' mal':'');
  panel.className='panel'+(mal?' mal':''); panel.innerHTML=panelHtml(s); panel.scrollTop=0;
  pgs.innerHTML=STEPS.map(function(_,i){return '<div class="pg'+(i===step?' on':'')+'" style="width:'+(i===step?26:8)+'px"></div>';}).join('');
  prev.disabled=step===0; next.disabled=step===N-1;
}
prev.onclick=function(){if(step>0){step--;update();}};
next.onclick=function(){if(step<N-1){step++;update();}};
update();
</script>
