<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="roundedOuter">
      <rect x="20" y="20" width="1160" height="640" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#f8fafc"/>

  <!-- App container -->
  <g clip-path="url(#roundedOuter)">
    <rect x="20" y="20" width="1160" height="640" rx="16" fill="#ffffff" filter="url(#shadow1)"/>

    <!-- Top bar -->
    <rect x="20" y="20" width="1160" height="56" fill="#4f46e5"/>
    <text x="60" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff">German Tutor</text>
    <!-- DE flag -->
    <g transform="translate(185, 40)">
      <rect x="0" y="0" width="24" height="16" rx="2" fill="#000000"/>
      <rect x="0" y="5.3" width="24" height="5.3" fill="#DD0000"/>
      <rect x="0" y="10.6" width="24" height="5.4" fill="#FFCC00"/>
    </g>
    <!-- Nav tabs -->
    <g transform="translate(260, 36)">
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="13" fill="#c7d2fe">Chat</text>
      <rect x="70" y="0" width="80" height="28" rx="6" fill="rgba(255,255,255,0.15)"/>
      <text x="80" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Dashboard</text>
      <text x="180" y="18" font-family="system-ui, sans-serif" font-size="13" fill="#c7d2fe">Vocabulary</text>
      <text x="280" y="18" font-family="system-ui, sans-serif" font-size="13" fill="#c7d2fe">Grammar</text>
    </g>
    <!-- User avatar -->
    <circle cx="1140" cy="48" r="16" fill="rgba(255,255,255,0.2)"/>
    <text x="1140" y="53" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">ST</text>

    <!-- Main content area -->
    <!-- Stats row -->
    <g transform="translate(40, 96)">
      <!-- Streak card -->
      <rect x="0" y="0" width="208" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <g transform="translate(16, 20)">
        <circle cx="16" cy="16" r="16" fill="#fef3c7"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🔥</text>
      </g>
      <text x="56" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.3">STREAK</text>
      <text x="56" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b">15</text>
      <text x="84" y="50" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">days</text>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">↑ Best: 23 days</text>

      <!-- Words Learned card -->
      <rect x="224" y="0" width="208" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <g transform="translate(240, 20)">
        <circle cx="16" cy="16" r="16" fill="#dbeafe"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📚</text>
      </g>
      <text x="280" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.3">WORDS LEARNED</text>
      <text x="280" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b">342</text>
      <text x="240" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">+12 this week</text>

      <!-- Level card -->
      <rect x="448" y="0" width="208" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <g transform="translate(464, 20)">
        <circle cx="16" cy="16" r="16" fill="#e0e7ff"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🎯</text>
      </g>
      <text x="504" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.3">LEVEL</text>
      <text x="504" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#4f46e5">B1</text>
      <text x="464" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Intermediate</text>

      <!-- Accuracy card -->
      <rect x="672" y="0" width="208" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <g transform="translate(688, 20)">
        <circle cx="16" cy="16" r="16" fill="#dcfce7"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">✅</text>
      </g>
      <text x="728" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.3">ACCURACY</text>
      <text x="728" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b">87%</text>
      <text x="688" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">↑ 3% from last week</text>
    </g>

    <!-- Section title: Vocabulary Cards -->
    <text x="60" y="224" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Vocabulary Cards</text>
    <text x="60" y="242" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Recently studied words — click to practice</text>

    <!-- Vocabulary cards grid -->
    <g transform="translate(40, 256)">
      <!-- Card 1: der Bahnhof -->
      <rect x="0" y="0" width="176" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="176" height="4" rx="12 12 0 0" fill="#4f46e5"/>
      <text x="16" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#4f46e5">NOUN · MASKULIN</text>
      <text x="16" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">der Bahnhof</text>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">train station</text>
      <line x1="16" y1="94" x2="160" y2="94" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="16" y="104" width="80" height="18" rx="9" fill="#dcfce7"/>
      <text x="56" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Mastered</text>

      <!-- Card 2: die Speisekarte -->
      <rect x="192" y="0" width="176" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="192" y="0" width="176" height="4" rx="12 12 0 0" fill="#ec4899"/>
      <text x="208" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ec4899">NOUN · FEMININ</text>
      <text x="208" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">die Speisekarte</text>
      <text x="208" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">menu</text>
      <line x1="208" y1="94" x2="352" y2="94" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="208" y="104" width="80" height="18" rx="9" fill="#dcfce7"/>
      <text x="248" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Mastered</text>

