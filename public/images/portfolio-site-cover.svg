<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="This portfolio site — Astro islands architecture and Lighthouse performance scores">
  <defs>
    <linearGradient id="psbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="pssoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#psbg)"/>

  <g fill="#ea580c" opacity="0.12">
    <circle cx="66" cy="392" r="5"/><circle cx="116" cy="418" r="3"/><circle cx="730" cy="62" r="6"/>
    <circle cx="764" cy="110" r="3"/><circle cx="694" cy="396" r="4"/><circle cx="96" cy="62" r="4"/>
  </g>

  <!-- static shell (the "sea") -->
  <g filter="url(#pssoft)">
    <rect x="60" y="76" width="410" height="262" rx="18" fill="#ffffff"/>
  </g>
  <rect x="60" y="76" width="410" height="44" rx="18" fill="#ffedd5"/>
  <rect x="60" y="102" width="410" height="18" fill="#ffedd5"/>
  <text x="84" y="106" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#9a3412" letter-spacing="1.2">STATIC HTML · ZERO JS</text>

  <!-- static content lines -->
  <g fill="#e7e5e4">
    <rect x="84" y="140" width="200" height="14" rx="7"/>
    <rect x="84" y="166" width="290" height="10" rx="5"/>
    <rect x="84" y="186" width="248" height="10" rx="5"/>
  </g>

  <!-- islands -->
  <g>
    <rect x="84" y="216" width="118" height="46" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="143" y="244" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#ea580c">island</text>

    <rect x="216" y="216" width="118" height="46" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="275" y="244" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#ea580c">island</text>

    <rect x="348" y="216" width="98" height="46" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="397" y="244" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#fdba74">idle</text>
  </g>

  <g fill="#e7e5e4">
    <rect x="84" y="284" width="266" height="10" rx="5"/>
    <rect x="84" y="304" width="180" height="10" rx="5"/>
  </g>

  <!-- lighthouse scores -->
  <g filter="url(#pssoft)">
    <rect x="506" y="76" width="234" height="262" rx="18" fill="#ffffff"/>
  </g>
  <text x="530" y="112" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" fill="#9a3412" letter-spacing="1.2">LIGHTHOUSE</text>

  <!-- ring 1 -->
  <circle cx="574" cy="170" r="30" fill="none" stroke="#f5f5f4" stroke-width="8"/>
  <circle cx="574" cy="170" r="30" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 574 170)"/>
  <text x="574" y="177" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="800" fill="#166534">100</text>
  <text x="574" y="216" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="700" fill="#a8a29e">A11Y</text>

  <!-- ring 2 -->
  <circle cx="672" cy="170" r="30" fill="none" stroke="#f5f5f4" stroke-width="8"/>
  <circle cx="672" cy="170" r="30" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 672 170)"/>
  <text x="672" y="177" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="800" fill="#166534">100</text>
  <text x="672" y="216" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="700" fill="#a8a29e">SEO</text>

  <!-- ring 3 -->
  <circle cx="574" cy="268" r="30" fill="none" stroke="#f5f5f4" stroke-width="8"/>
  <circle cx="574" cy="268" r="30" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 574 268)"/>
  <text x="574" y="275" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="800" fill="#166534">100</text>
  <text x="574" y="314" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="700" fill="#a8a29e">BEST PRACT.</text>

  <!-- ring 4 -->
  <circle cx="672" cy="268" r="30" fill="none" stroke="#f5f5f4" stroke-width="8"/>
  <circle cx="672" cy="268" r="30" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="17" transform="rotate(-90 672 268)"/>
  <text x="672" y="275" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="800" fill="#9a3412">PERF</text>
  <text x="672" y="314" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="700" fill="#a8a29e">OPTIMIZED</text>

  <!-- title -->
  <text x="60" y="392" font-family="Outfit, Arial, sans-serif" font-size="29" font-weight="800" fill="#1c1917">This Site — SPA to Astro Islands</text>
  <text x="60" y="418" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="600" fill="#78716c">Partial hydration · self-hosted fonts · trilingual blog</text>
  <text x="740" y="418" text-anchor="end" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Astro</text>
</svg>
